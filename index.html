<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Croissant Kawaii AR</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <script>
    AFRAME.registerComponent('girar-croissant', {
      tick: function (time, delta) {
        this.el.object3D.rotation.y += delta * 0.0005;
      }
    });
  </script>
</head>

<body>
  <a-scene
    mindar-image="imageTargetSrc: ./croissant.mind; maxTrack: 1"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <a-asset-item
        id="panDulce"
        src="./croissant.glb">
      </a-asset-item>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity mindar-image-target="targetIndex: 0">

      <a-entity
        position="0 0 0.15"
        animation="property: position;
                   to: 0 0 0.25;
                   dur: 1500;
                   easing: easeInOutSine;
                   loop: true;
                   dir: alternate">

        <a-gltf-model
          src="#panDulce"
          position="0 0 0"
          rotation="0 0 0"
          scale="0.03 0.03 0.03"
          girar-croissant>
        </a-gltf-model>

      </a-entity>

      <a-circle
        position="0 0 0.005"
        radius="0.22"
        rotation="0 0 0"
        color="#53362C"
        opacity="0.25"
        material="transparent: true; depthWrite: false">
      </a-circle>

    </a-entity>

  </a-scene>
</body>
</html>
